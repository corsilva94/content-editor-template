<!doctype html><html lang="en" data-resolution="portrait"><head><meta charset="utf-8"><title>My First Video</title><script src="assets/vendor/gsap.min.js"></script><style>*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden;background:#142B5B}.clip{position:absolute;inset:0}video{width:1080px;height:1920px;object-fit:cover}#main{width:1080px;height:1920px;position:relative}</style></head><body><div id="main" data-composition-id="main" data-width="1080" data-height="1920" data-duration="8.0"><video id="footage" class="clip" data-start="0" data-duration="8.0" data-track-index="0" data-has-audio="true" src="assets/media/footage.mp4" playsinline data-layout-ignore></video><div id="graphics-host" data-composition-id="graphics" class="clip" data-start="0" data-duration="8.0" data-track-index="1" data-track-kind="graphics" data-composition-src="compositions/graphics.html" data-layout-allow-overlap></div><div id="captions-host" data-composition-id="captions" class="clip" data-start="0" data-duration="8.0" data-track-index="2" data-track-kind="captions" data-composition-src="compositions/captions.html" data-layout-allow-overlap></div></div><script>window.__timelines=window.__timelines||{};const main=gsap.timeline({paused:true});window.__timelines.main=main;

cameraPlan.forEach(c=>main.set('#footage',{scale:c.scale,x:c.x,y:c.y,transformOrigin:'0 0'},c.time));</script></body></html>
